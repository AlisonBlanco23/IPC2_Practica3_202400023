{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Supermercado</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <div class="container">
        <h1>Sistema de Inventario</h1>
        <a href="{% url 'crear_producto' %}" class="btn btn-success">➕ Añadir Producto</a>
        <hr>

        {% if messages %}
            <div class="messages">
                <ul>
                    {% for message in messages %}
                        <li class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                            {{ message }}
                        </li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
