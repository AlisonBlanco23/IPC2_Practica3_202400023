{% extends 'base.html' %}

{% block content %}
<h2>Editar Producto</h2>
<form method="post" style="max-width: 1000px; margin: 0 auto;">
    {% csrf_token %}
    
    <label>Nombre:</label>
    <input type="text" name="nombre" value="{{ producto.nombre }}" required>

    <label>Categoría:</label>
    <input type="text" name="categoria" value="{{ producto.categoria }}" required>

    <label>Descripción:</label>
    <textarea name="descripcion" rows="4" required>{{ producto.descripcion }}</textarea>

    <label>Precio (Q):</label>
    <input 
        type="number" 
        step="0.01" 
        name="precio" 
        value="{{ producto.precio|stringformat:'s' }}" 
        min="0" 
        required>

    <label>Cantidad en stock:</label>
    <input 
        type="number" 
        name="cantidad" 
        value="{{ producto.cantidad|stringformat:'s' }}" 
        min="0" 
        required>

    <label>Fecha de vencimiento:</label>
    <input 
        type="date" 
        name="fecha_vencimiento" 
        value="{{ producto.fecha_vencimiento|default_if_none:'' }}">

    <button type="submit" class="btn btn-success">Actualizar Producto</button>
    <a href="{% url 'detalle_producto' producto.id %}" class="btn">Cancelar</a>
</form>
{% endblock %}
